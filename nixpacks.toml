# Explicit Node build so a stray page.tsx / Next leftover cannot
# pull nixpacks into a Next.js provider that then fails to start.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build:client"]

[start]
cmd = "NODE_ENV=production node server/src/index.js"
