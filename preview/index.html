<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brief</title>
    <!-- Telegram WebApp SDK: enables Mini App auth (initData) when the app is
         opened inside Telegram. Harmless no-op outside Telegram. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Favicon: the brand mark as a self-contained SVG (no network fetch, so it
         can never 404 or block paint). Mirrors the BrandMark green circle. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090B10'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%2343D17A' opacity='0.18'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2343D17A'/%3E%3C/svg%3E" />
    <!-- Design system type (§3): Fraunces + IBM Plex, loaded NON-BLOCKING so a
         slow or blocked Google Fonts request can never blank the first paint.
         The page renders instantly on the system-font fallback and upgrades to
         the brand faces the moment they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
